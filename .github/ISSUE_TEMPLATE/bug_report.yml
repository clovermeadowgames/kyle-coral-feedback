name: 🐛 Report a bug
description: Something in the game is broken, stuck, or weird.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found something broken or weird? Let's squash it.

        Three quick boxes and you're done. A screenshot helps if you've got one.

        > Wondering whether something *should* work differently (rather than it
        > being broken)? File it as a **Design question** instead — it gets a
        > better answer over there.

  - type: textarea
    id: what
    attributes:
      label: What's up?
      description: |
        Tell it like you'd tell a friend. What did you see? One sentence is plenty,
        but we do need the sentence, even if you're also adding a picture.
      placeholder: "Kyle got stuck in the wall next to an air bubble and couldn't move."
    validations:
      required: true

  - type: textarea
    id: should
    attributes:
      label: What should it be instead? (optional)
      description: |
        Already got the fix in your head? Put it here: "sequence the beats",
        "make it consistent everywhere", "this scene should be mid-level, not at the start".

        This is the most useful box for us. It becomes the checklist we use to call the
        fix done. Skip it if you're just flagging the problem.
      placeholder: "The two popups should stack, not overlap. Nudge the second one down or delay it."
    validations:
      required: false

  - type: dropdown
    id: where
    attributes:
      label: Where were you?
      description: Which part of the game? Pick the closest one.
      options:
        - Shallows (levels 1–3)
        - Kelp Forest (levels 4–7)
        - Deep Blue (levels 8–12)
        - Sunken Ruins (levels 13–17)
        - Abyss (levels 18–20)
        - The Sunken Ship (secret wreck)
        - Rapture of the Deep
        - Trading Post or Black Market (the shops)
        - The Dive Map
        - Title screen, menus, or settings
        - Somewhere else / not sure
    validations:
      required: true

  - type: dropdown
    id: how_bad
    attributes:
      label: How bad is it?
      description: Pick by what it *did to your game*, not how ugly it was.
      options:
        - "Stopped me: it crashed, froze, or I got stuck and had to quit"
        - "Cost me the run: I lost a life, lost pearls, or had to start over"
        - "Wrong, but I played on: something worked, just not the way it should"
        - "Only looks wrong: a visual glitch, nothing actually broke"
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Picture or video (optional)
      description: |
        Drag a screenshot or clip here. A picture helps a lot, especially for anything visual.

        Please add a sentence up top too. A report that's only a screenshot can't be worked
        on, because our tools often can't read image attachments.
    validations:
      required: false

  - type: textarea
    id: game_info
    attributes:
      label: "Game info — the seed box (optional, but important for gameplay bugs)"
      description: |
        Was it a *gameplay* bug (stuck, crash, froze, wrong physics, something off in the
        cave itself)? In the game, press ESC, click `Copy Bug Info`, and paste it here. The
        seed regenerates your exact cave so we can see the bug ourselves. Without it, on
        those, we're guessing.

        Pure visual glitch? A screenshot's plenty; you can skip this box.

        (The button's also inside `Debug…`, where it's called `Copy Info`.)
      placeholder: |
        Kyle Coral v0.7.0
        Seed: 3681153803
        Level: 7 (KELP FOREST)
        Player: cell (222, 4) @ (3567, 65)
        Platform: macOS
      render: text
    validations:
      required: false

name: Decline code PRs
on:
  pull_request_target:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  decline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Decline code PRs from OUTSIDE the team only. Owners, org members, and
            // collaborators can still open normal docs/config PRs against this repo.
            const assoc = context.payload.pull_request.author_association;
            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(assoc)) return;

            const author = context.payload.pull_request.user.login;
            const body = [
              `Thanks, @${author}. This repo is our feedback intake: the game's source`,
              "isn't hosted here, so there's nothing for a code change to modify.",
              "",
              "Closing this one, but the reports and ideas you file here are exactly what",
              "we're after: [open a bug report or feature idea instead](../../issues/new/choose).",
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number, state: 'closed',
            });
